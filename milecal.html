<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이용고 배당 산출 예시</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      max-width: 720px;
    }
    .form-label {
      font-weight: 600;
    }
    .result-box, .detail-box {
      background: #fff8e1;
      border-left: 5px solid #ffa000;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-top: 1.5rem;
    }
    .detail-box {
      background-color: #f1f3f5;
      border-left: 5px solid #607d8b;
      display: none;
    }
    .toggle-detail {
      cursor: pointer;
      color: #1565c0;
      font-weight: bold;
      margin-top: 1rem;
      display: none;
    }
    .form-control, .form-select {
      height: 50px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <!-- 모달 -->
  <div class="modal fade" id="alertModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center">
        <div class="modal-header">
          <h5 class="modal-title">📢 안내</h5>
        </div>
        <div class="modal-body">
          단순 참고용으로 이용 바랍니다.<br>
          2025년도 이용고 배당은 2026년 2월 (총회 승인 후)에 지급 예정입니다.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-warning w-100" data-bs-dismiss="modal">확인</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <h4 class="text-center mb-4">📊 이용고 배당 산출 예시</h4>
    <h5>🤷‍♂️아래 항목에 샘플 숫자만 입력하신 후 이용고배당 산출하기를 누르세요</h5>
    <hr>
    <form id="bonusForm">
      <div class="mb-3">
        <label class="form-label">1. 연간 대출금 평균잔액</label>
        <input type="number" class="form-control" id="one" placeholder="예: 1,000 (만원)" />
      </div>
      <div class="mb-3">
        <label class="form-label">2. 요구불(입출금)예금 평균잔액</label>
        <input type="number" class="form-control" id="two" placeholder="예: 300 (만원)" />
      </div>
      <div class="mb-3">
        <label class="form-label">3. 적금 평균잔액</label>
        <input type="number" class="form-control" id="three" placeholder="예: 200 (만원)" />
      </div>
      <div class="mb-3">
        <label class="form-label">4. 체크카드 연간 사용액</label>
        <input type="number" class="form-control" id="four" placeholder="예: 1,200 (만원)" />
      </div>
      <div class="mb-3">
  <label class="form-label">5. 월평균 자동(납부)이체 건수</label>
  <select class="form-select" id="five"></select>
</div>

      <div class="mb-3">
        <label class="form-label">6. 월평균 신협공제(보험) 납입금액</label>
        <input type="number" class="form-control" id="six" placeholder="예: 20 (만원)" />
      </div>
      <button type="submit" class="btn btn-primary w-100">🔢총 이용고 배당액 산출하기</button>
    </form>

    <div class="result-box mt-4" id="resultBox" style="display:none;">
      <h5 id="resultText"></h5>
    </div>

    <div class="toggle-detail" id="toggleDetail">☞ 항목별 이용고 배당 보기</div>
    <div class="detail-box" id="detailBox"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const select = document.getElementById("five");
    for (let i = 0; i <= 20; i++) {
      const option = document.createElement("option");
      option.value = i;
      option.textContent = i;
      select.appendChild(option);
    }
  });
</script>

  <script>
  window.addEventListener("DOMContentLoaded", () => {
    const alertModal = new bootstrap.Modal(document.getElementById('alertModal'));
    alertModal.show();
  });

  document.getElementById("bonusForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const one = +document.getElementById("one").value * 10000;
    const two = +document.getElementById("two").value * 10000;
    const three = +document.getElementById("three").value * 10000;
    const four = +document.getElementById("four").value * 10000;
    const five = +document.getElementById("five").value;
    const six = +document.getElementById("six").value * 10000;

    const calOne = one * 0.0025;
    const calTwo = two * 0.009;
    const calThree = three * 0.008;
    const calFour = four * 0.007;
    const calFive = five * 6560;
    const calSix = six * 0.068;

    const total = calOne + calTwo + calThree + calFour + calFive + calSix;
    const totalFormatted = Math.round(total / 10) * 10;

    document.getElementById("resultText").innerText =
      `💸총 예상 배당액은 약 ${totalFormatted.toLocaleString()}원입니다.`;
    document.getElementById("resultBox").style.display = "block";

    const detail = `
      1️⃣ 대출 이용 배당: ${Math.round(calOne).toLocaleString()}원<br/>
      2️⃣ 요구불예금 배당: ${Math.round(calTwo).toLocaleString()}원<br/>
      3️⃣ 적금 이용 배당: ${Math.round(calThree).toLocaleString()}원<br/>
      4️⃣ 체크카드 배당: ${Math.round(calFour).toLocaleString()}원<br/>
      5️⃣ 자동이체 배당: ${Math.round(calFive).toLocaleString()}원<br/>
      6️⃣ 공제(보험) 배당: ${Math.round(calSix).toLocaleString()}원
    `;
    document.getElementById("detailBox").innerHTML = detail;
    document.getElementById("toggleDetail").style.display = "block";

    // ⬇️ 계산 후 결과로 자동 스크롤
    setTimeout(() => {
      document.getElementById("resultBox").scrollIntoView({ behavior: "smooth", block: "start" });
    }, 300);
  });

  document.getElementById("toggleDetail").addEventListener("click", () => {
    const detailBox = document.getElementById("detailBox");
    const toggleBtn = document.getElementById("toggleDetail");

    const isVisible = detailBox.style.display !== "none";

    if (isVisible) {
      detailBox.style.display = "none";
      toggleBtn.innerText = "☞ 항목별 이용고 배당 보기";
    } else {
      detailBox.style.display = "block";
      toggleBtn.innerText = "☞ 항목별 이용고 배당 닫기";

      // ⬇️ 항목 상세보기 스크롤 이동
      setTimeout(() => {
        detailBox.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 300);
    }
  });
</script>

</body>
</html>
