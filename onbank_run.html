<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>온뱅크 실행 페이지</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f8fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      padding: 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 20px;
    }
    button {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
    }
    button:hover {
      background: #0056b3;
    }
    .qr {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📲 온뱅크 실행</h1>
    <p>앱이 설치되어 있으면 실행되고,<br>없으면 스토어로 이동합니다.</p>
    <button onclick="openOnbank()">다시 실행하기</button>
    <div class="qr">
      <p>QR코드로 열기</p>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://onbank.cu.co.kr/run.html" alt="온뱅크 QR코드">
    </div>
  </div>

  <script>
    function openOnbank() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var now = Date.now();
      var timeout = 2000; // 2초 후 fallback

      if (/Android/i.test(ua)) {
        // ✅ 안드로이드: 앱 실행
        window.location.href = "intent://onbank.cu.co.kr?SCHEME_ACTION=web&SCHEME_PARAM=1#Intent;scheme=cuonbank;package=kr.co.cu.onbank;end;";
        setTimeout(function () {
          if (Date.now() - now < timeout + 100) {
            window.location.href = "https://play.google.com/store/apps/details?id=kr.co.cu.onbank";
          }
        }, timeout);

      } else if (/iPhone|iPad|iPod/i.test(ua)) {
        // ✅ iOS: 앱 실행
        window.location.href = "cuonbank://onbank.cu.co.kr?SCHEME_ACTION=web&SCHEME_PARAM=1";
        setTimeout(function () {
          if (Date.now() - now < timeout + 100) {
            window.location.href = "https://apps.apple.com/kr/app/id1484456647"; // iOS 앱스토어
          }
        }, timeout);

      } else {
        // ✅ PC → 신협 인터넷뱅킹
        window.location.href = "https://www.cu.co.kr";
      }
    }

    // ✅ 페이지 로딩 시 자동 실행
    document.addEventListener("DOMContentLoaded", function () {
      openOnbank();
    });
  </script>
</body>
</html>
