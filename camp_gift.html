<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>⭐신협 헌혈 감사 쿠폰 신청</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
        crossorigin="anonymous">

  <!-- jQuery (단일 버전만 사용) -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

  <style>
    body{display:flex;flex-direction:column;justify-content:center;background-color:ivory;text-align:center;margin:10px;}
    #coupon,#ifram{display:flex;flex-direction:column;text-align:center;border:1px solid #ccc;border-radius:10px;padding:20px;margin-bottom:20px;background-color:#f9f9f9;box-shadow:0 3px 6px rgba(0,0,0,.1);}
    button,button a{width:150px;font-size:large;font-weight:600;margin:10px;border:none;border-radius:5px;background-color:cornflowerblue;height:50px;color:#fff;box-shadow:0 4px 8px grey;}
    button:active{transform:scale(.98)}
    .input-group{margin-bottom:15px;}
    .input-group-text{font-weight:600;width:150px;}
    input.form-control{font-weight:600;box-shadow:0 1px 2px grey;}
    #loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9999;}
    #loading-spinner{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9999}
    .confetti{position:absolute;width:10px;height:10px;background:#ff0;opacity:0}
    .ans{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
    #ifram{display:none}
    .form-control:focus{box-shadow:0 0 0 .2rem rgba(13,110,253,.15);border-color:#86b7fe}
    @media (prefers-color-scheme: dark){
      #ifram .card{background-color:#111827;color:#e5e7eb}
      #ifram .form-text{color:#9ca3af!important}
    }
  </style>

<!-- AjouCU shared mobile UI -->
<link rel="stylesheet" href="notice-ui.css?v=20260812">
<script src="notice-ui.js?v=20260812" defer></script>
</head>
<body>
  <div id="coupon">
    <h2 id="memberqus">🤷‍♂️신협 조합원이신가요?</h2>
    <h2 id="donequs" style="display:none;">✨헌혈에 성공하셨나요?</h2>
    <br>
    <div class="ans">
      <button id="memyesAns">⭕예</button>
      <button id="doneyesAns" style="display:none;">⭕예</button>
      <button id="memnoAns">❌아니요</button>
      <button id="donenoAns" style="display:none;">❌아니요</button>
    </div>
  </div>

  <br>

  <div id="ifram" class="container my-4" style="max-width:520px;">
    <!-- Header -->
    <div class="p-4 rounded-4 mb-3 shadow-sm" style="background:linear-gradient(135deg,#f3f6ff 0%, #eef9ff 100%);">
      <h5 class="mb-1">⭐ 헌혈감사 모바일 커피 쿠폰 신청</h5>
      <p class="text-muted mb-0 small">소중한 헌혈에 감사드립니다. 간단히 정보를 입력해 주세요.</p>
    </div>

    <!-- Card -->
    <div class="card shadow-sm rounded-4 border-0">
      <div class="card-body p-4">
        <form id="signupForm" onsubmit="submitForm(event)" novalidate>
          <!-- 성명 -->
          <div class="form-floating mb-3">
            <input type="text" class="form-control rounded-3" id="name" name="name"
                   placeholder="성명" autocomplete="name" required>
            <label for="name">✨ 조합원 성명</label>
            <div class="form-text">실명으로 입력해 주세요.</div>
          </div>

          <!-- 사번/조합원번호 -->
          <div class="form-floating mb-3">
            <input type="tel" class="form-control rounded-3" id="idnum" name="idnum"
                   placeholder="사번 또는 조합원번호" inputmode="numeric" pattern="[0-9]*"
                   autocomplete="off" required>
            <label for="idnum">🔢 사번 또는 조합원번호</label>
            <div class="form-text">숫자만 입력됩니다.</div>
          </div>

          <!-- 연락처 -->
          <div class="form-floating mb-3">
            <input type="tel" class="form-control rounded-3" id="tel" name="tel"
                   placeholder="연락처" inputmode="numeric" pattern="[0-9]*"
                   autocomplete="tel" required>
            <label for="tel">📱 연락처</label>
            <div class="form-text">하이픈 없이 숫자만 입력해 주세요.</div>
          </div>

          <!-- 기타 -->
          <div class="form-floating mb-3">
            <input type="text" class="form-control rounded-3" id="etc" name="etc"
                   placeholder="기타 남기실 말씀(선택)" autocomplete="off">
            <label for="etc">💬 기타 남기실 말씀(선택)</label>
          </div>

          <button id="submitBtn" class="btn btn-primary w-100 rounded-3 py-2" type="submit">
            ✔제출하기
          </button>
        </form>
      </div>
    </div>

    <p class="text-center text-muted small mt-3">
      ✨제출 후 1~2일 내 카카오 알림톡으로 쿠폰이 발송됩니다.
    </p>

    <a href="https://ajou9770.github.io/usertip/index" id="meminfo" rel="noopener">
      <small onclick="alert('🤷‍♂️신협 이용(가입)안내 페이지로 이동합니다')">※신협 조합원은 어떻게 되고, 혜택이 무엇인가요?</small>
    </a>
    <br><br>

    <div id="kakao-talk-channel-chat-button"
         data-channel-public-id="_dfhkK" data-title="consult" data-size="small"
         data-color="yellow" data-shape="mobile" data-support-multiple-densities="true"></div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="bg-dark text-white rounded-4 p-4 d-flex align-items-center shadow-lg" style="min-width:260px;">
      <div id="loading-spinner" class="me-3"></div>
      <div>
        <div class="fw-semibold">📤 제출중입니다... 잠시만 기다려 주세요</div>
        <div class="small text-white-50">✨ 평생어부바 신협</div>
      </div>
    </div>
  </div>

  <!-- ✅ Confetti Container (필수) -->
  <div id="confetti-container"></div>

  <script>
    // 페이지 질의 응답 UI
    $(document).ready(function () {
      $("#memyesAns").on('click', function () {
        $("#donequs").show("slow");
        $("#meminfo, #memberqus, #memnoAns, #memyesAns").hide("slow");
        $("#doneyesAns, #donenoAns").show("slow");
        if (navigator.vibrate) navigator.vibrate(200);
      });

      $("#memnoAns").on('click', function () {
        alert("😪죄송합니다. 신협 조합원에 한해 추가 기념품을 신청하실 수 있습니다.");
        if (navigator.vibrate) navigator.vibrate(200);
        history.back();
      });

      $("#doneyesAns").on('click', function () {
        $("#ifram").show("slow");
        $("#coupon").hide("slow");
        if (navigator.vibrate) navigator.vibrate(200);
      });

      $("#donenoAns").on('click', function () {
        alert("😪ㅠㅠ 아쉽네요, 다음에 한번 더 참여해 주시기 바랍니다.");
        if (navigator.vibrate) navigator.vibrate(200);
        location.reload();
      });

      // 실시간 숫자만 허용 (0 보존)
      const digitsOnly = s => String(s||'').replace(/[^0-9]/g,'');
      ['idnum','tel'].forEach(id=>{
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', ()=>{
          const cur = el.value, cleaned = digitsOnly(cur);
          if (cur !== cleaned) el.value = cleaned;
        }, {passive:true});
      });
    });

    // 숫자만
    function onlyDigits(s){ return String(s||'').replace(/[^0-9]/g,''); }
    // 전화번호 10~11자리
    function isValidPhone(num){ const d=onlyDigits(num); return d.length===11; }

    // PHP 엔드포인트
    const ALIMTALK_ENDPOINT = 'https://ajoucu.mycafe24.com/relay_blood_cpn.php';

    async function submitForm(event) {
      event.preventDefault();

      const form = document.getElementById('signupForm');
      const submitBtn = document.getElementById('submitBtn');
      const formData = new FormData(form);

      const data = {
        name: String(formData.get('name')||'').trim(),
        idnum: onlyDigits(formData.get('idnum')),
        tel:   onlyDigits(formData.get('tel')),
        etc:   String(formData.get('etc')||'').trim()
      };

      // 검증
      if (!data.name){ alert('성명을 입력하세요.'); return; }
      if (!data.idnum){ alert('사번 또는 조합원번호를 입력하세요.'); return; }
      if (!isValidPhone(data.tel)){ alert('연락처는 010이 포함된 11자리 핸드폰번호로 입력하세요.'); return; }

      const confirmationMessage =
`이름: ${data.name}
전화번호: ${data.tel}
사번/조합원번호: ${data.idnum}

이대로 제출하시겠습니까?`;

      if (!confirm(confirmationMessage)) {
        alert('⚠️ 제출이 취소되었습니다.');
        return;
      }

      // 버튼/로딩 상태
      if (submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '📤제출중...잠시만 기다려주세요'; }
      setLoading(true);

      try {
        // 1) GAS 저장
        const gasResp = await fetch(
          'https://script.google.com/macros/s/AKfycbyve-xNtkR8QdMpd7PpIjd98-hSw3RIxcvpWpIcpqTFjewGiCqtGaMABlxgv1SXZ1oj/exec',
          { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(data) }
        );
        const gasJson = await gasResp.json().catch(()=>({status:'error'}));
        if (gasJson.status !== 'success') throw new Error('GAS 저장 실패');

        // 2) 알림톡(PHP)
        let altOk = false;
        try{
          const altResp = await fetch(ALIMTALK_ENDPOINT, {
            method:'POST',
            headers:{'Content-Type':'application/json; charset=utf-8'},
            body: JSON.stringify({ name: data.name, to: data.tel })
          });
          const altJson = await altResp.json().catch(()=>({result:'error'}));
          altOk = altResp.ok && String(altJson.result||'').toLowerCase() !== 'error';
        }catch(e){
          console.error('알림톡 예외:', e);
          altOk = false;
        }

        if (altOk){
          throwConfetti();
          setTimeout(()=>form.reset(), 800);
          alert('👌 접수가 완료되었습니다.\n\n☕ 모바일 커피 🎫 쿠폰은 신청일로부터 1~2일 내 카톡 알림톡으로 보내 드립니다.');
        } else {
          alert('👌 접수는 완료되었습니다.\n⚠️ 다만 알림톡 발송에 실패했습니다. 관리자에게 문의해 주세요.');
        }

      } catch (err) {
        console.error(err);
        alert('⚠️ 제출 중 오류가 발생했습니다. 다시 시도해 주세요.');
      } finally {
        if (submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '✔제출하기'; }
        setLoading(false);
      }
    }

    function setLoading(flag){
      const overlay = document.getElementById('loading-overlay');
      overlay.style.display = flag ? 'flex' : 'none';
    }

    function throwConfetti(){
      const container = document.getElementById('confetti-container');
      if (!container) return; // 안전 가드
      for (let i=0; i<100; i++){
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random()*100 + 'vw';
        c.style.top  = Math.random()*100 + 'vh';
        c.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16);
        container.appendChild(c);
      }
      const items = document.getElementsByClassName('confetti');
      setTimeout(()=>{ for (let i=0;i<items.length;i++){ items[i].style.opacity=1; items[i].style.transform='translateY(100vh)'; items[i].style.transition='all 3s ease-in-out'; }},0);
      setTimeout(()=>{ container.innerHTML=''; },3000);
    }
  </script>
</body>
</html>
