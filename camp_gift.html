<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⭐신협 헌혈 감사 쿠폰 신청</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: ivory;
            text-align: center;
            margin: 10px;
        }
        #coupon, #ifram {
            display: flex;
            flex-direction: column;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
        }
        button, button a {
            width: 150px;
            font-size: large;
            font-weight: 600;
            margin: 10px;
            border: none;
            border-radius: 5px;
            background-color: cornflowerblue;
            height: 50px;
            color: whitesmoke;
            box-shadow: 0 4px 8px grey;
        }
        button:active {
            transform: scale(0.98);
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group-text {
            font-weight: 600;
            width: 150px;
        }
        input.form-control {
            font-weight: 600;
            box-shadow: 0 1px 2px grey;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none; /* 처음에는 숨겨진 상태 */
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #loading-message {
            font-size: 24px;
            color: white;
        }
        #loading-spinner {
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        #confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff0;
            opacity: 0;
        }
        .ans {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        #ifram {
            display: none; /* 처음에는 숨겨진 상태 */
        }
    </style>
</head>
<body>
    <div id="coupon">
        <h2 id="memberqus">🤷‍♂️신협 조합원이신가요?</h2>
        <h2 id="donequs" style="display: none;">✨헌혈에 성공하셨나요?</h2>
        <br>
        <div class="ans">
            <button id="memyesAns">⭕예</button>
            <button id="doneyesAns" style="display: none;">⭕예</button>
            <button id="memnoAns">❌아니요</button>
            <button id="donenoAns" style="display: none;">❌아니요</button>
        </div>
    </div>
    <br>
    <div id="ifram">
        <h4>| 헌혈감사 모바일 커피 쿠폰 신청 |</h4>
        <br>
        <form id="signupForm" onsubmit="submitForm(event)">
            <div class="input-group">
                <span class="input-group-text">✨조합원성명</span>
                <input type="text" id="name" name="name" class="form-control" required>
            </div>
            <div class="input-group">
                <span class="input-group-text">🔢사번or조합원번호</span>
                <input type="number" id="idnum" name="idnum" class="form-control" placeholder="숫자만" required>
            </div>
            <div class="input-group">
                <span class="input-group-text">📱연락처</span>
                <input type="number" id="tel" name="tel" class="form-control" placeholder="숫자만 입력하세요" required>
            </div>
            <br>
            <label for="etc">💬기타 남기실 말씀?(선택)</label>
            <input class="form-control" type="text" id="etc" name="etc"><br>
            <button class="btn btn-primary w-100" type="submit">✔신청하기</button>
        </form>
        <div id="loading-overlay">
            <div id="loading-spinner"></div>
            <div id="loading-message">
                <span style="padding-left: 15px;">로딩중입니다...</span>
                <br>
                <small>✨평생어부바 신협</small>
            </div>
        </div>
        <div id="confetti-container"></div>
    </div>
    <a href="http://ajou9770.github.io/usertip/index" id="meminfo">
        <small onclick="alert('🤷‍♂️신협 이용(가입)안내 페이지로 이동합니다')">※신협 조합원은 어떻게 되고, 혜택이 무엇인가요?</small>
    </a>
    <br><br>
    <div id="kakao-talk-channel-chat-button" data-channel-public-id="_dfhkK" data-title="consult" data-size="small" data-color="yellow" data-shape="mobile" data-support-multiple-densities="true"></div>
    
    <script>
        $(document).ready(function () {
            // "예" 버튼 클릭 시
            $("#memyesAns").click(function () {
                $("#donequs").show("slow");
                $("#meminfo").hide("slow");
                $("#memberqus").hide("slow");
                $("#memnoAns").hide("slow");
                $("#memyesAns").hide("slow");
                $("#doneyesAns").show("slow");
                $("#donenoAns").show("slow");
            });

            // "아니요" 버튼 클릭 시
            $("#memnoAns").click(function () {
                alert("😪죄송합니다. 신협 조합원에 한해 추가 기념품을 신청하실 수 있습니다.");
                navigator.vibrate(200);
                history.back();
            });

            // "헌혈에 성공하셨나요?"에서 "예" 버튼 클릭 시
            $("#doneyesAns").click(function () {
                $("#ifram").show("slow");
                $("#coupon").hide("slow");
                navigator.vibrate(200);
            });

            // "헌혈에 성공하셨나요?"에서 "아니요" 버튼 클릭 시
            $("#donenoAns").click(function () {
                alert("😪ㅠㅠ 아쉽네요, 다음에 한번 더 참여해 주시기 바랍니다.");
                location.reload();
                navigator.vibrate(200);
            });
        });

        async function submitForm(event) {
            event.preventDefault();
            const form = document.getElementById('signupForm');
            const formData = new FormData(form);

            const data = {
                name: formData.get('name'),
                idnum: formData.get('idnum'),
                tel: formData.get('tel'),
                etc: formData.get('etc')
            };

            const confirmationMessage = `
            이름: ${data.name}
            전화번호: ${data.tel}
            사번또는조합원번호: ${data.idnum}

            이대로 제출하시겠습니까?`;

            if (confirm(confirmationMessage)) {
                try {
                    const response = await fetch(
                        'https://script.google.com/macros/s/AKfycbyve-xNtkR8QdMpd7PpIjd98-hSw3RIxcvpWpIcpqTFjewGiCqtGaMABlxgv1SXZ1oj/exec',
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded'
                            },
                            body: new URLSearchParams(data)
                        }
                    );

                    const result = await response.json();

                    if (result.status === 'success') {
                        throwConfetti();
                        setTimeout(() => form.reset(), 2000);
                        alert(
                            '👌 헌혈 감사 쿠폰이 신청 되었습니다. \n ☕ 모바일 커피 🎫 쿠폰은 신청일로부터 1~2일내 카톡 알림톡으로 보내 드립니다'
                        );
                    } else {
                        alert('⚠️ 제출 중 오류가 발생했습니다.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('⚠️ 제출 중 오류가 발생했습니다.');
                }
            } else {
                alert('⚠️ 제출이 취소되었습니다.');
            }
        }

        function throwConfetti() {
            var container = document.getElementById('confetti-container');
            for (var i = 0; i < 100; i++) {
                var confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = Math.random() * 100 + 'vh';
                confetti.style.backgroundColor = '#' + Math
                    .floor(Math.random() * 16777215)
                    .toString(16);
                container.appendChild(confetti);
            }

            var confettis = document.getElementsByClassName('confetti');
            setTimeout(function () {
                for (var i = 0; i < confettis.length; i++) {
                    confettis[i].style.opacity = 1;
                    confettis[i].style.transform = 'translateY(100vh)';
                    confettis[i].style.transition = 'all 3s ease-in-out';
                }
            }, 0);

            setTimeout(function () {
                container.innerHTML = '';
            }, 3000);
        }

        window.addEventListener('load', function () {
            var spinner = document.getElementById('loading-spinner');
            var loadingOverlay = document.getElementById('loading-overlay');
            spinner.style.display = 'none';
            loadingOverlay.style.display = 'none';
        });

    </script>
</body>
</html>
