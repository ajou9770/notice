<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대출서류 온라인제출및신청예약</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Remove margins and paddings to make iframe fullscreen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        header {
            width: 95%;
            text-align: center;
            padding: 10px 0;
            background-color: #f8f9fa;
            border-bottom: 1px solid #ddd;
        }
        header h1 {
            width: 95%;
            margin: 0;
            font-size: 1.1rem;
            color: #333;
        }
        .iframe-container {
            flex: 1;
            position: relative;
            width: 95%;
            height: 850px;
            overflow: hidden;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 850px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <header class="text-center mb-4">
            <h3 class="h3">[대출서류 온라인제출 및 방문 예약하기]</h3>
        </header>
        <div class="iframe-container">
            <!-- Replace the src URL below with your Google Apps Script web app URL -->
            <iframe src="https://script.google.com/macros/s/AKfycbzmv-lbEP06vRUKsf7zaGI0p1TAPDfCq23zdOelrSXC2O9vYFWw4tVlYxTuu0umVeG6Nw/exec" allowfullscreen></iframe>
        </div>
        <footer class="text-center mt-4">
            <p class="text-muted small">© 아주대학교의료원 신용협동조합</p>
        </footer>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
