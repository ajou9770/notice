    <div class="mb-3">

      <select class="form-select work_two none mt-2 custom-select">

      </select>
      <select class="form-select work_three none mt-2 custom-select">
        <option value="1">2년 이상</option>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const jobSelect = document.querySelector(".job");
  const levelStaff = document.querySelector(".level");
  const levelProfessor = document.querySelector(".two_level");
  const workStaff = document.querySelector(".work");
  const workProfessor2 = document.querySelector(".work_two");
  const workProfessor3 = document.querySelector(".work_three");

  function updateFormVisibility() {
    const job = jobSelect.value;

    // 기본적으로 모두 숨김
    levelStaff.style.display = "none";
    levelProfessor.style.display = "none";
    workStaff.style.display = "none";
    workProfessor2.style.display = "none";
    workProfessor3.style.display = "none";

    if (job === "2") { // 직원
      levelStaff.style.display = "block";
      workStaff.style.display = "block";
    } else if (job === "3") { // 교원
      levelProfessor.style.display = "block";
      workProfessor2.style.display = "block";
      <!-- workProfessor3.style.display = "block"; -->
    }
  }

  // 초기 상태 반영
  updateFormVisibility();

  // 직종 변경 시 반영
  jobSelect.addEventListener("change", updateFormVisibility);
});
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const level = document.getElementById("level");
    const twoLevelBox = document.getElementById("two_level_box");

    const work = document.getElementById("work");
    const workDetailBox = document.getElementById("work_detail_box");

    // 직급 분기
    level.addEventListener("change", function () {
      if (this.value === "교원") {
        slideDown(twoLevelBox);
      } else {
        slideUp(twoLevelBox);
      }
    });

    // 재직기간 분기
    work.addEventListener("change", function () {
      if (this.value === "10년이상") {
        slideDown(workDetailBox);
      } else {
        slideUp(workDetailBox);
      }
    });

    function slideDown(elem) {
      elem.style.display = "block";
      elem.style.height = "0px";
      setTimeout(() => {
        elem.classList.add("show-section");
        elem.style.height = elem.scrollHeight + "px";
      }, 10);
    }

    function slideUp(elem) {
      elem.style.height = "0px";
      setTimeout(() => {
        elem.classList.remove("show-section");
        elem.style.display = "none";
      }, 400);
    }
  });
</script>
