<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>💵 외부자금유치분석보고</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      input::placeholder {
        color: #bbb;
      }

      body {
        background: #f5f7fa;
      }

      .main-container {
        max-width: 1000px;
        margin: 0 auto;
      }

      .input-card {
        background: #fff;
        border: 0;
        border-radius: 16px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        padding: 24px;
      }

      .form-label {
        font-weight: 600;
        color: #343a40;
      }

      .form-control {
        min-height: 46px;
      }

      /* 보고서 */
      #pdfContent {
        width: 100%;
        max-width: 210mm;
        margin: 0 auto;
        background: #fff;
        padding: 24px;
        font-size: 11pt;
        line-height: 1.55;
        word-break: keep-all;
      }

      #pdfContent .list-group-item {
        padding: 7px 12px;
        border: 1px solid #ddd;
      }

      .report-title {
        border-bottom: 2px solid #212529;
        padding-bottom: 12px;
        margin-bottom: 18px;
      }

      .report-section-title {
        font-weight: 700;
        margin-top: 20px;
        margin-bottom: 10px;
        color: #333;
      }

      .profit-result {
        font-size: 1.1rem;
      }

      .action-area {
        text-align: center;
        margin-top: 20px;
        margin-bottom: 30px;
      }

      .btn-print {
        min-width: 220px;
        font-weight: 600;
      }

      @media (max-width: 767px) {
        body {
          padding: 15px !important;
        }

        .input-card {
          padding: 18px;
        }

        #pdfContent {
          padding: 16px;
          font-size: 10.5pt;
        }
      }

      /* =========================
       인쇄 / PDF 저장
       ========================= */
      @media print {
        @page {
          size: A4 portrait;
          margin: 12mm;
        }

        html,
        body {
          background: #fff !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        body * {
          visibility: hidden;
        }

        #pdfContent,
        #pdfContent * {
          visibility: visible;
        }

        #pdfContent {
          position: absolute;
          left: 0;
          top: 0;

          width: 100% !important;
          max-width: none !important;

          margin: 0 !important;
          padding: 0 !important;

          box-shadow: none !important;
          border: none !important;

          font-size: 10.5pt;
          line-height: 1.45;

          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        #pdfContent .list-group-item {
          break-inside: avoid;
          page-break-inside: avoid;
        }

        .bg-success {
          background-color: #198754 !important;
          color: white !important;
        }

        .bg-light {
          background-color: #f8f9fa !important;
        }

        .no-print {
          display: none !important;
        }
      }
    </style>

    <!-- AjouCU shared mobile UI -->
    <link rel="stylesheet" href="notice-ui.css?v=20260812" />
    <script src="notice-ui.js?v=20260812" defer></script>
  </head>

  <body class="p-4">
    <div class="main-container">
      <h3 class="mb-4">💱 외부유치자금 운용수익분석보고</h3>

      <!-- 입력영역 -->
      <div class="input-card">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label"> 💵 예치 예정액 (단위: 천원) </label>
            <input
              type="text"
              id="principal"
              class="form-control"
              placeholder="예: 1,000,000 (⇒ 10억원)"
            />
          </div>

          <div class="col-md-6">
            <label class="form-label"> 🚩 상준금(의무예치 10%) 이율 (%) </label>
            <input
              type="number"
              id="reserveRate"
              class="form-control"
              placeholder="예: 2.20"
              step="0.01"
            />
          </div>

          <div class="col-md-6">
            <label class="form-label"> ✔️ 지급(제안)이자율 (%) </label>
            <input
              type="number"
              id="payRate"
              class="form-control"
              placeholder="예: 2.55"
              step="0.01"
            />
          </div>

          <div class="col-md-6">
            <label class="form-label"> 💱 운영(확정)금리 (%) </label>
            <input
              type="number"
              id="operationRate"
              class="form-control"
              placeholder="예: 2.85"
              step="0.01"
            />
          </div>

          <div class="col-md-6">
            <label class="form-label"> 📅 예치기간 (개월) </label>
            <input
              type="number"
              id="period"
              class="form-control"
              placeholder="예: 12"
              step="1"
            />
          </div>

          <div class="col-md-6">
            <label class="form-label">
              💡 당해 예금보호기금 출연금요율
              <small class="text-muted">(10 ⇒ 10/10000)</small>
            </label>

            <input
              type="number"
              id="fundFeeRate"
              class="form-control"
              placeholder="예: 10"
              step="1"
            />

            <div class="alert alert-warning py-2 mt-2 mb-0 small">
              📍 7월 이후는 요율을 15 이상으로 설정 검토 (익년 요율변경 반영)
            </div>
          </div>

          <div class="col-12">
            <a
              href="https://www.cu.co.kr/cu/cm/cntnts/cntntsView.do?cntntsId=1052&mi=100093"
              target="_blank"
              rel="noopener noreferrer"
            >
              🔗 2025년 예보출연금 요율 산출근거(목표기금제)
            </a>
          </div>
        </div>

        <button class="btn btn-primary mt-4 px-4" onclick="calculate()">
          📊 분석 하기
        </button>
      </div>

      <!-- 분석 결과 -->
      <div class="mt-4" id="resultArea"></div>

      <!-- 인쇄버튼 -->
      <div class="action-area d-none no-print" id="printArea">
        <button
          type="button"
          class="btn btn-dark btn-lg btn-print"
          onclick="printReport()"
        >
          🖨️ 인쇄(PDF 생성)하기
        </button>

        <div class="text-muted small mt-2">
          인쇄창에서 <strong>PDF로 저장</strong>을 선택하면 보고서 첨부용 PDF
          파일로 저장할 수 있습니다.
        </div>
      </div>
    </div>

    <script>
      /* ========================================
   예치금액 쉼표 자동 입력
   ======================================== */
      document
        .getElementById("principal")
        .addEventListener("input", function () {
          let value = this.value.replace(/[^0-9]/g, "");

          if (value) {
            this.value = parseInt(value, 10).toLocaleString();
          } else {
            this.value = "";
          }
        });

      /* ========================================
   원 단위 표시 함수
   ======================================== */
      function formatWon(value) {
        return Math.round(value).toLocaleString("ko-KR") + "원";
      }

      /* ========================================
   계산
   ======================================== */
      function calculate() {
        const today = new Date().toLocaleDateString("ko-KR", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        });

        const principalRaw = document
          .getElementById("principal")
          .value.replace(/,/g, "");

        /* 천원 → 원 */
        const principal = parseFloat(principalRaw) * 1000;

        const reserveRate = parseFloat(
          document.getElementById("reserveRate").value,
        );

        const payRate = parseFloat(document.getElementById("payRate").value);

        const operationRate = parseFloat(
          document.getElementById("operationRate").value,
        );

        const period = parseFloat(document.getElementById("period").value);

        const fundFeeRate = parseFloat(
          document.getElementById("fundFeeRate").value,
        );

        /* 입력 확인 */
        if (
          isNaN(principal) ||
          isNaN(reserveRate) ||
          isNaN(payRate) ||
          isNaN(operationRate) ||
          isNaN(period) ||
          isNaN(fundFeeRate)
        ) {
          alert("모든 항목을 입력해 주세요.");
          return;
        }

        if (principal <= 0 || period <= 0) {
          alert("예치금액과 예치기간은 0보다 커야 합니다.");
          return;
        }

        /* ========================================
     자금 구분
     ======================================== */

        /* 의무상준금 10% */
        const reserve = principal * 0.1;

        /* 실제 운용자금 90% */
        const operationFund = principal * 0.9;

        /* ========================================
     수익
     ======================================== */

        const reserveIncome = reserve * (reserveRate / 100) * (period / 12);

        const operationIncome =
          operationFund * (operationRate / 100) * (period / 12);

        const totalIncome = reserveIncome + operationIncome;

        /* ========================================
     비용
     ======================================== */

        const paidInterest = principal * (payRate / 100) * (period / 12);

        /*
    출연금 요율
    예: 10 → 10/10000 = 0.001
  */
        const fundFee = principal * (fundFeeRate / 10000);

        const totalCost = paidInterest + fundFee;

        /* ========================================
     순이자차익
     ======================================== */

        const netProfit = totalIncome - totalCost;

        /*
    총 예치금액 대비
    연환산 순수익률
  */
        const annualizedNetRate =
          principal > 0 && period > 0
            ? (netProfit / principal) * (12 / period) * 100
            : 0;

        /* ========================================
     보고서
     ======================================== */

        const reportHtml = `

    <div
      id="pdfContent"
      class="card shadow-sm"
    >

      <div class="report-title">

        <h4 class="mb-2">
          외부유치자금 운용수익 분석 보고서
        </h4>

        <div class="text-muted">
          아주대의료원신협
        </div>

      </div>


      <div class="text-end mb-3">
        <strong>기준일 :</strong>
        ${today}
      </div>


      <div class="report-section-title">
        1. 분석조건
      </div>


      <ul class="list-group mb-4">

        <li class="list-group-item d-flex justify-content-between">
          <span>예치금액</span>
          <strong>
            ${(principal / 1000).toLocaleString()} 천원
          </strong>
        </li>

        <li class="list-group-item d-flex justify-content-between">
          <span>의무상준금 이율</span>
          <strong>${reserveRate}%</strong>
        </li>

        <li class="list-group-item d-flex justify-content-between">
          <span>지급(제안)이자율</span>
          <strong>${payRate}%</strong>
        </li>

        <li class="list-group-item d-flex justify-content-between">
          <span>운영(확정)금리</span>
          <strong>${operationRate}%</strong>
        </li>

        <li class="list-group-item d-flex justify-content-between">
          <span>예금보호기금 출연금요율</span>
          <strong>${fundFeeRate}/10000</strong>
        </li>

        <li class="list-group-item d-flex justify-content-between">
          <span>예치기간</span>
          <strong>${period}개월</strong>
        </li>

      </ul>


      <div class="report-section-title">
        2. 운용자금 구성
      </div>


      <ul class="list-group mb-4">

        <li class="list-group-item d-flex justify-content-between">
          <span>의무상준금 (10%)</span>
          <strong>${formatWon(reserve)}</strong>
        </li>

        <li class="list-group-item d-flex justify-content-between">
          <span>실제 운용자금 (90%)</span>
          <strong>${formatWon(operationFund)}</strong>
        </li>

      </ul>


      <div class="report-section-title">
        3. 예상 운용수익
      </div>


      <ul class="list-group mb-4">

        <li class="list-group-item d-flex justify-content-between">
          <span>의무상준금 수익</span>
          <strong>${formatWon(reserveIncome)}</strong>
        </li>

        <li class="list-group-item d-flex justify-content-between">
          <span>운용자금 수익</span>
          <strong>${formatWon(operationIncome)}</strong>
        </li>

        <li class="list-group-item bg-light d-flex justify-content-between">
          <strong>총 수익</strong>
          <strong>${formatWon(totalIncome)}</strong>
        </li>

      </ul>


      <div class="report-section-title">
        4. 예상 조달비용
      </div>


      <ul class="list-group mb-4">

        <li class="list-group-item d-flex justify-content-between">
          <span>지급이자</span>
          <strong>${formatWon(paidInterest)}</strong>
        </li>

        <li class="list-group-item d-flex justify-content-between">
          <span>예금보호기금 출연금</span>
          <strong>${formatWon(fundFee)}</strong>
        </li>

        <li class="list-group-item bg-light d-flex justify-content-between">
          <strong>총 비용</strong>
          <strong>${formatWon(totalCost)}</strong>
        </li>

      </ul>


      <div class="report-section-title">
        5. 분석결과
      </div>


      <ul class="list-group">

        <li
          class="list-group-item
                 bg-success
                 text-white
                 profit-result
                 d-flex
                 justify-content-between"
        >
          <strong>순이자차익</strong>

          <strong>
            ${formatWon(netProfit)}
          </strong>
        </li>

        <li
          class="list-group-item
                 d-flex
                 justify-content-between"
        >
          <span>연환산 예상 순수익률</span>

          <strong>
            ${annualizedNetRate.toFixed(3)}%
          </strong>
        </li>

      </ul>


      <div
        class="mt-4 pt-3 border-top text-muted"
        style="font-size:9pt;"
      >
        ※ 본 분석은 입력된 금리 및 요율을 기준으로 산출한
        예상 손익으로 실제 운용결과와 차이가 발생할 수 있습니다.
      </div>

    </div>

  `;

        document.getElementById("resultArea").innerHTML = reportHtml;

        /* 인쇄 버튼 표시 */
        document.getElementById("printArea").classList.remove("d-none");

        /* 결과 위치로 이동 */
        document.getElementById("resultArea").scrollIntoView({
          behavior: "smooth",
          block: "start",
        });
      }

      /* ========================================
   보고서 인쇄 / PDF 저장
   ======================================== */
      function printReport() {
        const report = document.getElementById("pdfContent");

        if (!report) {
          alert("먼저 분석을 실행해 주세요.");
          return;
        }

        /*
    브라우저 기본 인쇄창 실행

    Chrome / Edge:
    대상 → PDF로 저장

    또는 실제 프린터 출력
  */
        window.print();
      }
    </script>
  </body>
</html>
