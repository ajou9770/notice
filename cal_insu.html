<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>보증보험 대출한도 및 보험료 조회</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
  <div class="container">
    <h3 class="text-center mb-4">🔍 대출한도.보험료 조회</h3>

    <!-- 대출한도 조회 -->
    <div class="card mb-4">
      <div class="card-header bg-primary text-white">1️⃣ 대출한도 조회</div>
      <div class="card-body">
        <label for="kcbScoreLimit" class="form-label">KCB평점 입력</label>
        <input type="number" id="kcbScoreLimit" class="form-control mb-3" placeholder="예: 935">
        <button onclick="checkLoanLimit()" class="btn btn-success">조회</button>
        <div id="limitResult" class="mt-3 fw-bold"></div>
      </div>
    </div>

    <!-- 보험료 계산기 -->
    <div class="card">
      <div class="card-header bg-secondary text-white">2️⃣ 보험료 계산기</div>
      <div class="card-body">
        <div class="mb-3">
          <label for="loanAmount" class="form-label">대출금액 (만원)</label>
          <input type="number" id="loanAmount" class="form-control" placeholder="예: 5000">
        </div>
        <div class="mb-3">
          <label for="kcbScoreRate" class="form-label">KCB 평점 입력</label>
          <input type="number" id="kcbScoreRate" class="form-control" placeholder="예: 935">
        </div>
        <p><mark>🤷🏽‍♀️일시상환조건의 보험료이며 분할상환은 이보다 보험료가 훨씬 적습니다.</mark></p>
        <button onclick="calculateInsurance()" class="btn btn-primary">보험료 조회</button>
        <div id="insuranceResult" class="mt-3 fw-bold"></div>
      </div>
    </div>
  </div>

  <script>
    // KCB 구간별 요율 테이블
    const kcbTable = [
      { min: 980, max: 1000, rate: 0.522 },
      { min: 965, max: 979, rate: 0.555 },
      { min: 945, max: 964, rate: 0.592 },
      { min: 930, max: 944, rate: 0.624 },
      { min: 910, max: 929, rate: 0.662 },
      { min: 890, max: 909, rate: 0.699 },
      { min: 865, max: 889, rate: 0.725 },
      { min: 835, max: 864, rate: 0.758 },
      { min: 805, max: 834, rate: 0.791 },
      { min: 775, max: 804, rate: 0.831 },
      { min: 745, max: 774, rate: 0.877 },
      { min: 710, max: 744, rate: 0.932 },
      { min: 680, max: 709, rate: 0.971 },
      { min: 655, max: 679, rate: 1.002 },
      { min: 630, max: 654, rate: 1.028 },
      { min: 595, max: 629, rate: 1.058 },
      { min: 550, max: 594, rate: 1.099 },
      { min: 475, max: 549, rate: 1.169 },
      { min: 400, max: 474, rate: 1.235 },
      { min: 1,   max: 399, rate: 1.309 }
    ];

    function checkLoanLimit() {
      const score = parseInt(document.getElementById("kcbScoreLimit").value);
      const resultBox = document.getElementById("limitResult");

      if (isNaN(score)) {
        resultBox.innerText = "❗KCB 평점을 입력해주세요.";
        return;
      }

      if (score >= 930) {
        resultBox.innerText = "✅ 예상 보증보험 대출한도: 95백만원";
      } else {
        resultBox.innerText = "✅ 예상 보증보험 대출한도: 36백만원";
      }
    }

   function calculateInsurance() {
  const amount = parseFloat(document.getElementById("loanAmount").value);
  const score = parseInt(document.getElementById("kcbScoreRate").value);
  const resultBox = document.getElementById("insuranceResult");

  if (isNaN(amount) || isNaN(score)) {
    resultBox.innerText = "❗대출금액과 KCB 평점을 모두 입력해주세요.";
    return;
  }

  if (amount > 9500) {
  resultBox.innerText = "⛔대출금액은 최대 9,500만원까지 입력 가능합니다.";
  resultBox.scrollIntoView({ behavior: "smooth" });
  return;
}


  const entry = kcbTable.find(item => score >= item.min && score <= item.max);
  if (!entry) {
    resultBox.innerText = "❗입력된 KCB 평점에 해당하는 구간이 없습니다.";
    return;
  }

  const rate = entry.rate; // % 단위
  const insurance1yr = Math.floor((amount * 1.1) * (rate / 100) * 1.7 * 10000 / 10) * 10;
  const insurance2yr = insurance1yr * 2;

  resultBox.innerHTML = `
    💰 <strong>대출기간 1년: 예상 보험료:</strong> ${insurance1yr.toLocaleString()}원<br>
    🔁 <strong>대출기간 2년: 예상 보험료:</strong> ${insurance2yr.toLocaleString()}원<br>
    🤷🏽‍♀️ 중도상환시 잔여기간 보험료는 환급 됩니다. 
  `;
  // 결과 표시 후 부드럽게 스크롤 이동
  resultBox.scrollIntoView({ behavior: "smooth" });
}
  </script>
</body>
</html>
