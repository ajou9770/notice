<!DOCTYPE html>
<html>
  <head>
    <title>자금세탁자가점검표(임원용)</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      .iframe-container {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
        height: 0;
        overflow: hidden;
      }
      .iframe-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .title {
        text-align: center;
      }
  .signature-pad {
    border: 2px dashed #ccc;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    background-color: #f9f9f9;
  }
  .scroll-button {
    position: fixed;
    right: 10px;
    z-index: 1000;
    cursor: pointer;
    background-color: #007bff;
    border: none;
    border-radius: 50%;
    color: white;
    padding: 10px;
    text-align: center;
  }
  .scroll-button.up {
    top: 50%;
    transform: translateY(-100%);
  }
  .scroll-button.down {
    top: 60%;
  }
  </style>
  </head>
  <body>
    <div class="container mt-5">
        <div class="title">
        <h4 class="mb-4">[자금세탁방지 자가점검표(임원용)]</h4>
        </div>
      <p>
        # 관련근거 : 조합 자금세탁방지 등에 관한 업무처리지침 제3절<br><br>
        # 상기 관련으로 조합은 자금세탁 행위 등에 조합의 임직원이 이용되지 않기 위해 임직원의 채용(임용) 또는 재직중 임직원에 대하여 신원확인 및 검증절차를 년 1회이상 실시하고,
        이행완료 정보에 대해 적절한 방법으로 보관 관리하여야 함에 따라 아래와 같이 임원의 자가점검표를 작성.제출하여 주시기 바랍니다. 
      </p>
      <div class="iframe-container">
        <iframe src="https://script.google.com/macros/s/AKfycbyKZTcXaiOg-jC8i9SuCS0bpcZqQn6jAP-9N2PwbrklMYME7heVGCYIVXd1-CAs8uBr/exec"></iframe>
      </div>
    </div>
    <button class="scroll-button up" onclick="scrollUp()">↑</button>
   <button class="scroll-button down" onclick="scrollDown()">↓</button>
   <script>
    function scrollUp() {
      window.scrollBy({ top: -100, behavior: 'smooth' });
    }
  
    function scrollDown() {
      window.scrollBy({ top: 100, behavior: 'smooth' });
    }
  </script>
 
  </body>
</html>
