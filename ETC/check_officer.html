<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <title>자금세탁방지 자가점검표 작성(임원용)</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <style>
        body {
            display: inline-block;
            flex-direction: column;
            justify-content: center;
            vertical-align: middle;
            text-align: justify;
            margin-left: 10px;
            margin-right: 10px;
        }
        div {
            display: flex;
            flex-direction: column;
            text-align: end;
            border-color: black;            
            border-radius: 10px;
            justify-content: center;
            align-items: center;
            color: seashell;
        }
        button, button a {
            width: 100%;
            font-size: x-large;
            font-weight: 600;
            font-size: larger;
            border: none;
            border-radius: 5px;
            height: 50px;
            color: whitesmoke;
        }
        button:active {
            transform: scale(0.98);
        }
        img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0px 4px 8px grey;
        }
        #congratClose{
            display: none;
        }  
        p {
            font-size: 17px;
        }
        td { vertical-align: middle; 
        }
        td.centered {
            text-align: center;
            vertical-align: middle;
        }
        th.centered {
            text-align: center;
            vertical-align: middle;
        }
        iframe {
            border: none;
            border-radius: 5px;
            box-shadow: 0px 2px 4px lightslategrey;
            width: 100%;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* 배경 색상과 투명도를 조정하세요 */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #loading-message {
            font-size: 24px;
            color: white;
        }
        #loading-spinner {
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .center {
            text-align: center;
            color: black;
        }
        iframe {
            display: none;
            padding-bottom: 20px;
        }
        #scroll-buttons {
            position: fixed;
            right: 10px;
            bottom: 50%;
            z-index: 1000;
        }
        #scroll-buttons button {
            margin: 5px 0;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer; 
        }
        .title {
          text-align: center;
        }
    </style>
    <script>
        $(document).ready(function(){
            $("#imgbtn").click(function(){
                $("#dropdown-content").show("slow");
                $("#closeBtn").show("slow");
                $("#imgbtn").hide("slow");
                window.scrollTo(0, document.body.scrollHeight);
            });
            $("#closeBtn").click(function(){
                $("#dropdown-content").hide("slow");
                $("#closeBtn").hide("slow");
                $("#imgbtn").show("slow");
                window.scrollTo(0, document.body.scrollHeight);
            });
            $("#payimgBtn").click(function(){
                $("#payimg").toggle("slow");
            });

            // iOS(아이폰 계열)의 경우 우측 스크롤 상하 버튼 생성(안내 포함)
            if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
                var scrollButtons = `
                    <div id="scroll-buttons" style="display:none;">
                        <button onclick="window.scrollBy(0, -window.innerHeight / 2)">▲</button>
                        <button onclick="window.scrollBy(0, window.innerHeight / 2)">▼</button>
                    </div>
                `;
                $("body").append(scrollButtons);
                alert('🤷🏽‍♀️아이폰 등 iOS 계열은 우측의 🔼🔽로 상.하 스크롤 이동이 가능합니다');
                $("#scroll-buttons button").show();
            }
        });

        function openCongrat() {
            document.getElementById("ifram").style.display="block";
            document.getElementById("congratClose").style.display="block";
            document.getElementById("congratOpen").style.display="none";
            document.getElementById("scroll-buttons").style.display = "block";
            adjustIframeHeight();
        }

        function closeCongrat() {
            document.getElementById("ifram").style.display="none";
            document.getElementById("congratClose").style.display="none";
            document.getElementById("congratOpen").style.display="block";
            document.getElementById("scroll-buttons").style.display = "none";
        }

        function adjustIframeHeight() {
            var iframe = document.getElementById("ifram");
            iframe.style.height = iframe.contentWindow.document.body.scrollHeight + "px";
        }

        window.addEventListener('message', function(event) {
            if (event.data === 'adjustIframeHeight') {
                adjustIframeHeight();
            }
        });
    </script>
</head>
<body>
    <div class="center">
        <h4 class="mb-4">[자금세탁방지 자가점검표]</h4>
    </div>
    <hr>
    <p>
        # 관련근거 : 조합 자금세탁방지 등에 관한 업무처리지침 제3절<br><br>
        # 상기 관련으로 조합은 자금세탁 행위 등에 조합의 임직원이 이용되지 않기 위해 임직원의 채용(임용) 또는 재직중 임직원에 대하여 신원확인 및 검증절차를 년 1회이상 실시하고,
        이행완료 정보에 대해 적절한 방법으로 보관 관리하여야 함에 따라 아래와 같이 임원의 자가점검표를 작성.제출하여 주시기 바랍니다. 
    </p>
    <button id="congratOpen" style="color: #3498db; font-size: 20px;" onclick="openCongrat()">📝자가점검표 작성하기🔽</button>
    <button id="congratClose" style="color: #3498db; font-size: 15px;" onclick="closeCongrat()">❌자가점검표 닫기🔼</button> 
    <iframe id="ifram" src="https://script.google.com/macros/s/AKfycbyKZTcXaiOg-jC8i9SuCS0bpcZqQn6jAP-9N2PwbrklMYME7heVGCYIVXd1-CAs8uBr/exec" width="100%" height="1000" frameborder="0" marginheight="0" marginwidth="0" onload="adjustIframeHeight()">로드 중…</iframe>  
    <br>
    <div id="loading-overlay">
        <div id="loading-spinner"></div>
        <div id="loading-message"><span style="padding-left: 15px;">로딩중입니다...</span>
        <small>✨평생어부바 신협</small>
        </div>
    </div>
    <script>
        window.onload = function() {
            var topElement = document.getElementById("top");
            topElement.scrollIntoView();
            console.log("moved top");
        };

        // 페이지 로딩이 완료되면 로딩 스피너를 숨깁니다.
        window.addEventListener('load', function() {
            var spinner = document.getElementById('loading-spinner');
            spinner.style.display = 'none';
        });

        window.addEventListener('load', function() {
            var loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.style.display = 'none';
        });
    </script>
</body>
</html>
