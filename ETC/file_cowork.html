<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <title>업무공유파일Up&Download</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    iframe {
      border-radius: 5px;
      box-shadow: 0 2px 4px lightslategrey;
      width: 100%;
      height: 100%;
      max-height: 800px;
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #loading-message {
      font-size: 24px;
      color: white;
    }
    #loading-spinner {
      border: 16px solid #f3f3f3;
      border-top: 16px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="content">
    <iframe id="iframe" src="https://script.google.com/macros/s/AKfycbzbq1QKAHq9DpdUxHnB8tD8xL1DsSjWpIP_r5LgU58kFAMSwe9uyKpCRs8O15iq_P7C/exec">로드 중…</iframe>
  </div>
  <div class="container mt-3 text-center">
    <button id="installButton" class="btn btn-primary">바탕화면에 바로가기 추가</button>
  </div>
  <div id="loading-overlay">
    <div id="loading-spinner"></div>
    <div id="loading-message">
      <span style="padding-left: 15px;">로딩중입니다...</span>
      <small>✨평생어부바 신협</small>
    </div>
  </div>
  <script>
    
    let deferredPrompt;
    const installButton = document.getElementById('installButton');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installButton.style.display = 'block';
    });

    installButton.addEventListener('click', () => {
      installButton.style.display = 'none';
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('사용자가 설치를 수락했습니다.');
        } else {
          console.log('사용자가 설치를 거부했습니다.');
        }
        deferredPrompt = null;
      });
    });


    function resizeIframe() {
      var iframe = document.getElementById('iframe');
      iframe.style.height = window.innerHeight + 'px';
    }

    window.onload = function () {
      resizeIframe();
      window.addEventListener('resize', resizeIframe);
    };

    // 페이지 로딩이 완료되면 로딩 스피너를 숨깁니다.
    window.addEventListener('load', function () {
      var loadingOverlay = document.getElementById('loading-overlay');
      loadingOverlay.style.display = 'none';
    });
  </script>
</body>
</html>
